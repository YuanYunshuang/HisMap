DATASET:
  dataset: lgln
  name: lgln
  data_path: /home/yuan/data/HisMap/LGLN/dataset
  mode: train
  batch_size: 16
  n_workers: 4
  gpus: 0
  crop_size: 384
  crop_step_size: 256
  start_year: 1973
  end_year: 1975

  train_pipeline:
    - LGLNFlipRotImage: {}
    - LGLNFormatImage: {}
  test_pipeline:
    - LGLNFormatImage: {}

TRAIN:
  log_every: 10
  max_epoch: 50
  gpus: 0
  hooks: 'pycfg.base.hooks.lgln_train_hooks_pseudo'
  optimizer:
    lr: 0.00002
    weight_decay: 1e-2
    betas: [0.9, 0.98]
  lr_scheduler:
    policy: 'MultiStepLR'
    milestones: [50]
    gamma: 0.1

TEST:
  hooks:
    - type: LGLNEvalHook


MODEL:
  type: 'segnet.SegNet'
  num_classes: 6
  loss_cfg:
    type: FocalLoss
    use_sigmoid: false










